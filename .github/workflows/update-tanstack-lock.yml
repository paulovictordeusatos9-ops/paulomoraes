name: Update TanStack lockfile

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-lockfile:
    if: contains(github.event.head_commit.message, 'security: update TanStack Start')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install
      - name: Commit refreshed lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/update-tanstack-lock.yml
          git add bun.lock .github/workflows/update-tanstack-lock.yml
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh lockfile after TanStack security update"
          git push
