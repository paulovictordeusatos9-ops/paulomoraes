name: Convert hero video with audio

on:
  push:
    branches: [main]
    paths:
      - "public/copy_24BDD769-22C9-4ABF-BF99-2EF884BC6B0A.mov"
      - ".github/workflows/convert-hero-video-audio.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Convert MOV to HD MP4 preserving audio
        run: |
          mkdir -p public/videos
          ffmpeg -y -i "public/copy_24BDD769-22C9-4ABF-BF99-2EF884BC6B0A.mov" \
            -vf "scale=1920:1080:force_original_aspect_ratio=decrease,pad=1920:1080:(ow-iw)/2:(oh-ih)/2:color=black" \
            -r 30 -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p \
            -c:a aac -b:a 160k -movflags +faststart \
            "public/videos/video-principal.mp4"

      - name: Commit converted video
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/videos/video-principal.mp4
          git diff --cached --quiet || git commit -m "fix: preserve hero video audio"
          git pull --rebase origin main
          git push origin HEAD:main
